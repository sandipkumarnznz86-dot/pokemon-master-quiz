<main class="reset-page">
  <app-header></app-header>
  <section class="reset-card">
    <a routerLink="/login" class="back-link">← Back to Login</a>
    <p class="eyebrow">ACCOUNT RECOVERY</p>
    <h1>Forgot Password?</h1>
    <p class="intro">Enter your account email. If an account exists, a verification code will be sent.</p>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="email">Email address</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="trainer@example.com" />
      <small *ngIf="form.controls.email.touched && form.controls.email.invalid">Please enter a valid email address.</small>
      <p *ngIf="error" class="error" role="alert">{{ error }}</p>
      <button type="submit" [disabled]="loading">{{ loading ? 'Sending…' : 'Send Verification Code' }}</button>
    </form>
  </section>
  <app-footer></app-footer>
</main>
