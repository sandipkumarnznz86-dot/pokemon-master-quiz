<main class="reset-page">
  <app-header></app-header>
  <section class="reset-card">
    <ng-container *ngIf="!success; else successState">
      <a routerLink="/verify-reset-code" class="back-link">← Back</a>
      <p class="eyebrow">SECURE PASSWORD RESET</p>
      <h1>Create new password</h1>
      <p class="intro">Choose a new password for your PokéQuiz account.</p>
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label for="password">New password</label>
        <input id="password" type="password" formControlName="password" autocomplete="new-password" />
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password" />
        <small>Password must be at least 6 characters.</small>
        <p *ngIf="error" class="error" role="alert">{{ error }}</p>
        <button type="submit" [disabled]="loading">{{ loading ? 'Updating…' : 'Reset Password' }}</button>
      </form>
    </ng-container>
    <ng-template #successState>
      <p class="success-mark" aria-hidden="true">✓</p>
      <p class="eyebrow">PASSWORD UPDATED</p>
      <h1>Password Reset Successful</h1>
      <p class="intro">Your password has been changed successfully.</p>
      <button type="button" (click)="goToLogin()">Back to Login</button>
    </ng-template>
  </section>
  <app-footer></app-footer>
</main>
